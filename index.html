<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AFRIKA-LOVE V2</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:Arial;min-height:100vh}header{background:#1a1a1a;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:1px solid #333}.logo{font-weight:900;font-size:20px}.logo span{color:#ff7a00}#app{max-width:500px;margin:0 auto;min-height:100vh}.screen{display:none;padding:16px}.screen.active{display:block}.card{background:#1e1e1e;border-radius:16px;overflow:hidden;border:1px solid #2a2a2a;margin-bottom:16px}.card-img{width:100%;height:300px;object-fit:cover}.card-body{padding:14px}.card-name{font-size:20px;font-weight:700}.card-loc{color:#aaa;font-size:14px;margin:4px 0 8px}.card-bio{font-size:14px;color:#ddd;margin-bottom:12px}.btn-main{width:100%;background:linear-gradient(135deg,#ff7a00,#ff4e00);color:#fff;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}input,textarea,select{width:100%;background:#2a2a2a;border:1px solid #3a3a3a;padding:14px;border-radius:12px;color:#fff;margin-bottom:12px;font-size:16px;outline:none}#chatModal{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f0f;z-index:1000;flex-direction:column;display:none}#chatModal.active{display:flex}.chat-header{background:#1a1a1a;padding:12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333}.chat-header img{width:40px;height:40px;border-radius:50%}.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px}.msg.other{background:#2a2a2a;align-self:flex-start}.msg.me{background:linear-gradient(135deg,#ff7a00,#ff4e00);align-self:flex-end}.chat-input-area{background:#1a1a1a;padding:12px;display:flex;gap:10px;border-top:1px solid #333}.chat-input-area input{margin:0;flex:1}.chat-input-area button{background:#ff7a00;border:none;width:46px;height:46px;border-radius:50%;color:#fff}.back-btn{background:none;border:none;color:#fff;font-size:24px}</style></head><body><header><div class="logo">🌍 AFRIKA-<span>LOVE</span> REAL</div></header><div id="app"><div id="screenRegister" class="screen active"><h2 style="margin:20px 0 8px;font-size:24px">Bienvenue ❤️</h2><p style="color:#aaa;margin-bottom:20px">Crée ton VRAI profil pour rencontrer de vraies personnes à Conakry comme sur Facebook / WhatsApp</p><input id="regName" placeholder="Ton prénom (ex: Maruce)"><input id="regAge" type="number" placeholder="Ton âge"><select id="regCity"><option value="">Ta ville</option><option>Conakry, Guinée</option><option>Dakar, Sénégal</option><option>Abidjan, Côte d'Ivoire</option><option>Bamako, Mali</option></select><input id="regPhoto" placeholder="Lien photo (ou vide = avatar auto)"><textarea id="regBio" placeholder="Parle de toi..."></textarea><button class="btn-main" onclick="register()">🔥 Créer mon profil</button></div><div id="screenDiscover" class="screen"><div style="display:flex;justify-content:space-between;margin:10px 0"><h3 id="welcomeMsg">Découvrir</h3><button onclick="logout()" style="background:none;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:20px;font-size:12px">Déconnexion</button></div><div id="profilesList"></div></div></div><div id="chatModal"><div class="chat-header"><button class="back-btn" onclick="closeChat()">←</button><img id="chatAvatar" src=""><div><div id="chatName" style="font-weight:700"></div><div style="font-size:12px;color:#4ade80">● Vrai chat comme WhatsApp</div></div></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-area"><input id="msgInput" placeholder="Écris ton message..." onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div></div><script>let myProfile=JSON.parse(localStorage.getItem('afrika_myProfile')||'null');let currentChatWith=null;function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}if(myProfile)initApp();function register(){const name=document.getElementById('regName').value.trim();const age=document.getElementById('regAge').value.trim();const city=document.getElementById('regCity').value;const photo=document.getElementById('regPhoto').value.trim()||`https://i.pravatar.cc/500?u=${Date.now()}`;const bio=document.getElementById('regBio').value.trim();if(!name||!age||!city){alert("Remplis nom, âge et ville");return}myProfile={id:'user_'+Date.now(),name,age,city,photo,bio,createdAt:Date.now()};localStorage.setItem('afrika_myProfile',JSON.stringify(myProfile));let all=JSON.parse(localStorage.getItem('afrika_allUsers')||'[]');all.push(myProfile);localStorage.setItem('afrika_allUsers',JSON.stringify(all));initApp()}function initApp(){showScreen('screenDiscover');document.getElementById('welcomeMsg').innerText=`Salut ${myProfile.name} 👋`;loadProfiles()}function loadProfiles(){const listEl=document.getElementById('profilesList');let all=JSON.parse(localStorage.getItem('afrika_allUsers')||'[]');const demo=[{id:'demo1',name:'Aminata',age:24,city:'Conakry, Guinée',photo:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500',bio:'Vraie personne - Inscrite ❤️'},{id:'demo2',name:'Moussa',age:27,city:'Dakar, Sénégal',photo:'https://images.unsplash.com/photo-1506277886164-e25aa3f4ef7f?w=500',bio:'Entrepreneur ⚽'}];const combined=[...demo,...all.filter(a=>a.id!==myProfile.id)];listEl.innerHTML='';combined.forEach(p=>{if(p.id===myProfile.id)return;listEl.innerHTML+=`<div class="card"><img class="card-img" src="${p.photo}"><div class="card-body"><div class="card-name">${p.name}, ${p.age}</div><div class="card-loc">📍 ${p.city}</div><div class="card-bio">${p.bio||''}</div><button class="btn-main" onclick="openChat('${p.id}','${p.name}','${p.photo}')">💬 Parler à ${p.name} (VRAI)</button></div></div>`})}function getChatId(otherId){return[myProfile.id,otherId].sort().join('_')}function openChat(otherId,name,photo){currentChatWith={id:otherId,name,photo};document.getElementById('chatName').innerText=name;document.getElementById('chatAvatar').src=photo;document.getElementById('chatModal').classList.add('active');loadLocalMessages(getChatId(otherId))}function loadLocalMessages(chatId){const key='chat_'+chatId;let msgs=JSON.parse(localStorage.getItem(key)||'[]');const box=document.getElementById('chatMessages');box.innerHTML='';msgs.forEach(m=>{const div=document.createElement('div');div.className='msg '+(m.senderId===myProfile.id?'me':'other');div.innerText=m.text;box.appendChild(div)});box.scrollTop=box.scrollHeight}function closeChat(){document.getElementById('chatModal').classList.remove('active')}function sendMsg(){const input=document.getElementById('msgInput');const text=input.value.trim();if(!text||!currentChatWith)return;const chatId=getChatId(currentChatWith.id);const msg={senderId:myProfile.id,text,time:Date.now()};const key='chat_'+chatId;let msgs=JSON.parse(localStorage.getItem(key)||'[]');msgs.push(msg);localStorage.setItem(key,JSON.stringify(msgs));loadLocalMessages(chatId);input.value=''}function logout(){if(confirm("Se déconnecter ?")){localStorage.removeItem('afrika_myProfile');location.reload()}}</script></body></html>
