<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AFRIKA-LOVE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:Arial;min-height:100vh}header{background:#1a1a1a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid #333}.logo{font-weight:900;font-size:22px}.logo span{color:#ff7a00}.profiles{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:500px;margin:0 auto}.card{background:#1e1e1e;border-radius:16px;overflow:hidden;border:1px solid #2a2a2a}.card-img{width:100%;height:320px;object-fit:cover}.card-body{padding:14px}.card-name{font-size:20px;font-weight:700}.card-loc{color:#aaa;font-size:14px;margin:4px 0 8px}.card-bio{font-size:14px;color:#ddd;margin-bottom:12px}.btn-parler{width:100%;background:linear-gradient(135deg,#ff7a00,#ff4e00);color:#fff;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:800}#chatModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f0f;z-index:1000;flex-direction:column}#chatModal.active{display:flex}.chat-header{background:#1a1a1a;padding:12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333}.chat-header img{width:40px;height:40px;border-radius:50%}.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px}.msg.other{background:#2a2a2a;align-self:flex-start}.msg.me{background:linear-gradient(135deg,#ff7a00,#ff4e00);align-self:flex-end}.chat-input-area{background:#1a1a1a;padding:12px;display:flex;gap:10px;border-top:1px solid #333}.chat-input-area input{flex:1;background:#2a2a2a;border:none;padding:12px 16px;border-radius:24px;color:#fff;outline:none}.chat-input-area button{background:#ff7a00;border:none;width:44px;height:44px;border-radius:50%;color:#fff}.back-btn{background:none;border:none;color:#fff;font-size:24px}</style></head><body><header><div class="logo">🌍 AFRIKA-<span>LOVE</span></div><div>💬</div></header><div class="profiles"><div class="card"><img class="card-img" src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500"><div class="card-body"><div class="card-name">Aminata, 24</div><div class="card-loc">📍 Conakry, Guinée</div><div class="card-bio">Passionnée de culture africaine, danse et voyages. ❤️</div><button class="btn-parler" onclick="openChat('Aminata','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=500')">💬 Parler</button></div></div><div class="card"><img class="card-img" src="https://images.unsplash.com/photo-1506277886164-e25aa3f4ef7f?w=500"><div class="card-body"><div class="card-name">Moussa, 27</div><div class="card-loc">📍 Dakar, Sénégal</div><div class="card-bio">Entrepreneur, fan de foot et afrobeat. 😎</div><button class="btn-parler" onclick="openChat('Moussa','https://images.unsplash.com/photo-1506277886164-e25aa3f4ef7f?w=500')">💬 Parler</button></div></div></div><div id="chatModal"><div class="chat-header"><button class="back-btn" onclick="closeChat()">←</button><img id="chatAvatar" src=""><div><div id="chatName" style="font-weight:700"></div><div style="font-size:12px;color:#4ade80">● En ligne</div></div></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-area"><input type="text" id="msgInput" placeholder="Écris ton message..." onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div></div><script>function openChat(n,a){document.getElementById('chatName').innerText=n;document.getElementById('chatAvatar').src=a;document.getElementById('chatModal').classList.add('active');document.getElementById('chatMessages').innerHTML='<div class=msg other>Salut ! C est '+n+' 😊 Merci pour ton message !</div>'}function closeChat(){document.getElementById('chatModal').classList.remove('active')}function sendMsg(){const i=document.getElementById('msgInput');const t=i.value.trim();if(!t)return;const b=document.getElementById('chatMessages');const m=document.createElement('div');m.className='msg me';m.innerText=t;b.appendChild(m);i.value='';b.scrollTop=b.scrollHeight;setTimeout(()=>{const r=document.createElement('div');r.className='msg other';const rs=["Haha j'adore 😂","Tu fais quoi ?","On se voit quand ? 😉","Trop cool !","Je suis à Conakry aussi !"];r.innerText=rs[Math.floor(Math.random()*rs.length)];b.appendChild(r);b.scrollTop=b.scrollHeight},1000)}</script></body></html>
